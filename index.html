<style>
/* Layout: clinic back-office — light blush ground, white rounded panels, raspberry actions; left rail nav, bottom tabs on phones */
:root {
  --bg: #fbf2f5; --surface: #ffffff; --sunk: #fdf6f8; --ink: #2b1821; --muted: #7d6571; --line: #f0dce4;
  --accent: #d63f78; --accent-deep: #9c2150; --accent-soft: #fce4ed; --accent-line: #f3bcd0; --accent-ink: #ffffff;
  --amber: #a86400; --amber-soft: #fff4d3; --red: #c43a2f; --red-soft: #fbe2df; --green: #23905a; --green-soft: #def3e7;
  --blue: #2f62b8; --blue-soft: #e3ebfa; --violet: #7048b8; --violet-soft: #eee6fa; --grey-soft: #f1e8ec;
  --s1: #3f9594; --s2: #b3322a; --s3: #e08a0b; --s4: #b4471f; --s5: #c23a72; --s-off: #e6d9df; --s-off-ink: #a8929d;
  --shadow: 0 1px 2px rgba(80, 20, 45, .05), 0 6px 22px rgba(80, 20, 45, .07);
  --f-display: "IBM Plex Sans Thai", "Bai Jamjuree", system-ui, sans-serif;
  --f-body: "IBM Plex Sans Thai", "Sarabun", "Leelawadee UI", system-ui, sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
  --r: 18px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #1b1116; --surface: #26171f; --sunk: #201319; --ink: #f7e9ef; --muted: #bb9dab; --line: #3e2632;
  --accent: #ef6a9c; --accent-deep: #f59dbf; --accent-soft: #4a1d30; --accent-line: #7a3150; --accent-ink: #2a0716;
  --amber: #f0b14a; --amber-soft: #3a2a10; --red: #f07f72; --red-soft: #431c18; --green: #63c98c; --green-soft: #173323;
  --blue: #86aaf2; --blue-soft: #1c2a47; --violet: #b79df2; --violet-soft: #2c2142; --grey-soft: #33222b;
  --s1: #4fb0ae; --s2: #d4554c; --s3: #f0a02b; --s4: #d9663a; --s5: #e05790; --s-off: #3f2a34; --s-off-ink: #8d7280;
  --shadow: 0 1px 2px rgba(0,0,0,.35), 0 8px 24px rgba(0,0,0,.3); color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #1b1116; --surface: #26171f; --sunk: #201319; --ink: #f7e9ef; --muted: #bb9dab; --line: #3e2632;
  --accent: #ef6a9c; --accent-deep: #f59dbf; --accent-soft: #4a1d30; --accent-line: #7a3150; --accent-ink: #2a0716;
  --amber: #f0b14a; --amber-soft: #3a2a10; --red: #f07f72; --red-soft: #431c18; --green: #63c98c; --green-soft: #173323;
  --blue: #86aaf2; --blue-soft: #1c2a47; --violet: #b79df2; --violet-soft: #2c2142; --grey-soft: #33222b;
  --s1: #4fb0ae; --s2: #d4554c; --s3: #f0a02b; --s4: #d9663a; --s5: #e05790; --s-off: #3f2a34; --s-off-ink: #8d7280;
  --shadow: 0 1px 2px rgba(0,0,0,.35), 0 8px 24px rgba(0,0,0,.3); color-scheme: dark; }

* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.55 var(--f-body); -webkit-font-smoothing: antialiased; }
h1, h2, h3 { font-family: var(--f-display); margin: 0; text-wrap: balance; letter-spacing: -.005em; }
h1 { font-size: 1.6rem; font-weight: 700; } h2 { font-size: 1.2rem; font-weight: 600; } h3 { font-size: 1rem; font-weight: 600; }
.mono { font-family: var(--f-mono); font-size: .88em; letter-spacing: .01em; }
.muted { color: var(--muted); } .small { font-size: .85rem; }
.num { font-variant-numeric: tabular-nums; }
a { color: var(--accent); }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }

/* ---------- login ---------- */
.login { min-height: 100%; display: grid; place-items: center; padding-block: 32px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.login-card { width: min(420px, 100%); background: var(--surface); border: 1px solid var(--line); border-radius: 14px; box-shadow: var(--shadow); padding: 28px; display: grid; gap: 18px; }
.brand { display: flex; align-items: center; gap: 12px; }
.mark { width: 42px; height: 42px; border-radius: 12px; background: var(--accent); color: var(--accent-ink); display: grid; place-items: center; flex: none; }
.mark svg { width: 24px; height: 24px; }
.brand-t { font-family: var(--f-display); font-weight: 700; font-size: 1.2rem; line-height: 1.2; color: var(--accent-deep); }
.brand-s { font-size: .8rem; color: var(--muted); }
.demo-box { background: var(--sunk); border: 1px dashed var(--line); border-radius: 8px; padding: 10px 12px; font-size: .84rem; display: grid; gap: 6px; }
.demo-box .acc { display: flex; flex-wrap: wrap; gap: 6px; }
.demo-box button { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 2px 10px; cursor: pointer; font-size: .8rem; }

/* ---------- shell ---------- */
.shell { display: grid; grid-template-columns: 228px 1fr; min-height: 100%; }
.rail { background: var(--surface); border-right: 1px solid var(--line); padding: 18px 12px; display: flex; flex-direction: column; gap: 18px; position: sticky; top: 0; height: 100vh; align-self: start; }
.rail .brand { padding: 0 6px; }
.nav { display: grid; gap: 2px; }
.nav button { display: flex; align-items: center; gap: 12px; width: 100%; padding: 11px 12px; border: 1px solid transparent; background: none; border-radius: 12px; cursor: pointer; text-align: left; color: var(--muted); font-weight: 500; }
.nav button svg { width: 19px; height: 19px; flex: none; }
.nav button:hover { background: var(--sunk); color: var(--ink); }
.nav button.on { background: var(--accent-soft); color: var(--accent-deep); border-color: var(--accent-line); font-weight: 600; }
.nav-l { font-size: .72rem; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); padding: 0 12px; font-weight: 600; }
.nav .badge { margin-left: auto; background: var(--red); color: #fff; font-size: .72rem; padding: 0 7px; border-radius: 999px; line-height: 1.6; }
.me { margin-top: auto; border-top: 1px solid var(--line); padding: 12px 6px 0; display: grid; gap: 8px; font-size: .85rem; }
.me-n { font-weight: 600; }
.me .row { display: flex; gap: 6px; flex-wrap: wrap; }
.main { min-width: 0; padding-block: 24px 40px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.wrap { max-width: 1180px; margin: 0 auto; display: grid; gap: 18px; }
.head { display: flex; align-items: end; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.mob-top { display: none; }
@media (max-width: 860px) {
  .shell { grid-template-columns: 1fr; }
  .rail { position: fixed; inset: auto 0 0 0; top: auto; height: auto; flex-direction: row; padding: 6px 4px calc(6px + env(safe-area-inset-bottom, 0px)); border-right: 0; border-top: 1px solid var(--line); z-index: 30; padding-left: max(4px, env(safe-area-inset-left, 0px)); padding-right: max(4px, env(safe-area-inset-right, 0px)); }
  .rail .brand, .rail .me, .rail .nav-l { display: none; }
  .nav { grid-auto-flow: column; grid-auto-columns: 1fr; width: 100%; }
  .nav button { flex-direction: column; gap: 2px; font-size: .7rem; padding: 6px 2px; text-align: center; justify-content: center; position: relative; }
  .nav .badge { position: absolute; top: 2px; right: 18%; margin: 0; }
  .main { padding-block: 0 96px; }
  .mob-top { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding-block: 12px; position: sticky; top: env(safe-area-inset-top, 0px); background: var(--bg); z-index: 20; }
  body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
}

/* ---------- elements ---------- */
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 20px; min-width: 0; box-shadow: var(--shadow); }
.panel > h2, .panel > h3 { margin-bottom: 12px; }
.ptitle { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; margin-bottom: 12px; flex-wrap: wrap; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; border: 1px solid var(--accent-line); color: var(--accent-deep); background: var(--surface); padding: 9px 16px; border-radius: 12px; cursor: pointer; font-weight: 500; white-space: nowrap; }
.btn:hover { border-color: var(--accent); background: var(--accent-soft); }
.btn svg { width: 17px; height: 17px; }
.btn.pri { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.pri:hover { filter: brightness(1.06); background: var(--accent); }
.btn.pri { box-shadow: 0 2px 8px rgba(214, 63, 120, .25); }
.btn.dng { color: var(--red); border-color: var(--red-soft); }
.btn.ghost { border-color: transparent; background: none; color: var(--muted); }
.btn.sm { padding: 4px 10px; font-size: .85rem; }
.btn:disabled { opacity: .55; cursor: progress; }
label.f { display: grid; gap: 5px; font-size: .86rem; font-weight: 500; min-width: 0; }
label.f > span em { color: var(--red); font-style: normal; }
input.i, select.i, textarea.i { width: 100%; border: 1px solid var(--line); background: var(--sunk); border-radius: 12px; padding: 9px 11px; font-size: .95rem; font-weight: 400; min-width: 0; }
textarea.i { resize: vertical; min-height: 78px; }
input.i:focus, select.i:focus, textarea.i:focus { outline: none; border-color: var(--accent); background: var(--surface); box-shadow: 0 0 0 3px var(--accent-soft); }
.grid2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; }
.grid3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; }
@media (max-width: 640px) { .grid2, .grid3 { grid-template-columns: 1fr; } }
.span2 { grid-column: 1 / -1; }
.stack { display: grid; gap: 14px; }
.row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.spacer { flex: 1; }
.err { color: var(--red); font-size: .88rem; min-height: 1.2em; }

.pill { display: inline-flex; align-items: center; gap: 5px; font-size: .78rem; font-weight: 600; padding: 2px 9px; border-radius: 999px; white-space: nowrap; background: var(--grey-soft); color: var(--muted); }
.pill::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
.st-submit { background: var(--blue-soft); color: var(--blue); }
.st-received { background: var(--accent-soft); color: var(--accent); }
.st-repair { background: var(--amber-soft); color: var(--amber); }
.st-parts { background: var(--red-soft); color: var(--red); }
.st-out { background: var(--violet-soft); color: var(--violet); }
.st-done { background: var(--green-soft); color: var(--green); }
.st-branch { background: var(--blue-soft); color: var(--blue); }
.st-replace { background: var(--red-soft); color: var(--red); }
.urg { font-size: .76rem; font-weight: 600; color: var(--muted); }
.urg.hot { color: var(--red); }
.code { font-family: var(--f-mono); font-size: .8rem; background: var(--sunk); border: 1px solid var(--line); border-radius: 5px; padding: 0 6px; white-space: nowrap; }

/* KPI */
.kpis { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 12px; }
@media (max-width: 1000px) { .kpis { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
@media (max-width: 560px) { .kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.kpi { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 16px 18px; display: grid; gap: 4px; cursor: default; box-shadow: var(--shadow); }
.kpi.click { cursor: pointer; } .kpi.click:hover { border-color: var(--accent); }
.kpi .l { font-size: .86rem; color: var(--muted); font-weight: 500; }
.kpi .v { font-family: var(--f-display); font-size: 1.9rem; font-weight: 700; font-variant-numeric: tabular-nums; line-height: 1.2; }
.kpi .v small { font-size: .9rem; font-weight: 500; color: var(--muted); }
.kpi.alert .v { color: var(--red); }
.dash { display: grid; grid-template-columns: minmax(0, 1.4fr) minmax(0, 1fr); gap: 18px; }
@media (max-width: 1000px) { .dash { grid-template-columns: 1fr; } }
.bars { display: grid; gap: 8px; }
.bar { display: grid; grid-template-columns: 150px 1fr 40px; gap: 10px; align-items: center; font-size: .86rem; }
.bar .t { height: 10px; background: var(--sunk); border-radius: 5px; overflow: hidden; }
.bar .t i { display: block; height: 100%; border-radius: 5px; background: var(--accent); }
.bar b { text-align: right; font-variant-numeric: tabular-nums; }
@media (max-width: 480px) { .bar { grid-template-columns: 110px 1fr 34px; } }
.chart { width: 100%; height: auto; display: block; }
.chart text { fill: var(--muted); font-size: 10px; font-family: var(--f-body); }
.chart .lbl { fill: var(--ink); font-weight: 600; }
table.t { width: 100%; border-collapse: collapse; font-size: .88rem; }
table.t th { text-align: left; font-weight: 600; color: var(--muted); font-size: .78rem; padding: 6px 8px; border-bottom: 1px solid var(--line); white-space: nowrap; }
table.t td { padding: 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
table.t tr:last-child td { border-bottom: 0; }
table.t tr.click { cursor: pointer; } table.t tr.click:hover td { background: var(--sunk); }
.tscroll { overflow-x: auto; }

/* list */
.filters { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.chips { display: flex; gap: 6px; flex-wrap: wrap; }
.chip { border: 1px solid var(--line); background: var(--surface); padding: 5px 12px; border-radius: 999px; cursor: pointer; font-size: .84rem; }
.chip.on { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.list { display: grid; }
.item { display: grid; grid-template-columns: 128px minmax(0, 1fr) auto; gap: 14px; padding: 12px 6px; border-bottom: 1px solid var(--line); cursor: pointer; align-items: start; }
.item:hover { background: var(--sunk); }
.item:last-child { border-bottom: 0; }
.item .no { font-family: var(--f-mono); font-size: .84rem; font-weight: 500; }
.item .tt { font-weight: 600; overflow-wrap: anywhere; }
.item .sub { font-size: .84rem; color: var(--muted); overflow-wrap: anywhere; }
.item .rt { display: grid; gap: 4px; justify-items: end; text-align: right; }
@media (max-width: 640px) { .item { grid-template-columns: minmax(0, 1fr) auto; } .item .lt { grid-column: 1 / -1; display: flex; gap: 8px; align-items: baseline; } }
.pager { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding-top: 12px; font-size: .86rem; flex-wrap: wrap; }
.empty { padding: 36px 12px; text-align: center; color: var(--muted); }

/* detail */
.detail { display: grid; grid-template-columns: minmax(0, 1.5fr) minmax(0, 1fr); gap: 18px; align-items: start; }
@media (max-width: 1000px) { .detail { grid-template-columns: 1fr; } }
.kv { display: grid; grid-template-columns: 130px minmax(0, 1fr); gap: 7px 14px; font-size: .92rem; }
.kv dt { color: var(--muted); } .kv dd { margin: 0; overflow-wrap: anywhere; white-space: pre-line; }
@media (max-width: 480px) { .kv { grid-template-columns: 1fr; gap: 0; } .kv dd { margin-bottom: 8px; } }
.thumbs { display: flex; gap: 8px; flex-wrap: wrap; }
.thumbs .th { width: 104px; height: 104px; border-radius: 8px; border: 1px solid var(--line); background: var(--sunk); object-fit: cover; cursor: zoom-in; position: relative; }
.thumbs .x { position: absolute; top: 4px; right: 4px; width: 22px; height: 22px; border-radius: 50%; border: 0; background: rgba(0,0,0,.6); color: #fff; cursor: pointer; line-height: 1; }
.thumbs .slot { position: relative; }
.drop { border: 1.5px dashed var(--line); border-radius: 8px; padding: 14px; text-align: center; color: var(--muted); font-size: .88rem; cursor: pointer; background: var(--sunk); }
.drop:hover { border-color: var(--accent); color: var(--accent); }
.timeline { display: grid; gap: 0; }
.tl { display: grid; grid-template-columns: 14px minmax(0, 1fr); gap: 10px; position: relative; padding-bottom: 14px; }
.tl::before { content: ""; position: absolute; left: 6px; top: 14px; bottom: 0; width: 2px; background: var(--line); }
.tl:last-child::before { display: none; }
.tl .dot { width: 14px; height: 14px; border-radius: 50%; border: 3px solid var(--accent); background: var(--surface); margin-top: 4px; }
.tl .when { font-size: .78rem; color: var(--muted); }
.tl .what { font-size: .9rem; overflow-wrap: anywhere; }
.actbox { border: 1.5px solid var(--accent-line); box-shadow: var(--shadow); border-radius: var(--r); background: var(--surface); padding: 18px; display: grid; gap: 14px; }
.actbox h3 { color: var(--accent-deep); }
.tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--line); }
.tabs button { border: 0; background: none; padding: 8px 12px; cursor: pointer; border-bottom: 2px solid transparent; color: var(--muted); font-weight: 500; }
.tabs button.on { color: var(--accent); border-bottom-color: var(--accent); }
.radios { display: grid; gap: 6px; }
.radios label { display: flex; gap: 8px; align-items: center; border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; cursor: pointer; font-size: .9rem; }
.radios label:has(input:checked) { border-color: var(--accent); background: var(--accent-soft); }
.stars { display: grid; gap: 10px; }
.star-q { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 10px; align-items: center; font-size: .9rem; }
@media (max-width: 480px) { .star-q { grid-template-columns: 1fr; gap: 4px; } }
.star-r { display: flex; gap: 4px; }
.star-r button { width: 34px; height: 34px; border-radius: 8px; border: 1px solid var(--line); background: var(--sunk); cursor: pointer; font-weight: 600; font-variant-numeric: tabular-nums; }
.star-r button.on { background: var(--amber); border-color: var(--amber); color: #fff; }
.score { font-family: var(--f-display); font-size: 2rem; font-weight: 700; color: var(--amber); line-height: 1; }
.hist { display: grid; gap: 8px; max-height: 340px; overflow: auto; }
.hist .h { border-left: 3px solid var(--line); padding: 2px 0 2px 10px; font-size: .86rem; cursor: pointer; }
.hist .h:hover { border-left-color: var(--accent); }
.confirm { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; background: var(--red-soft); color: var(--red); border-radius: 8px; padding: 8px 10px; font-size: .88rem; }
.sugg { position: relative; }
.sugg-list { position: absolute; z-index: 15; left: 0; right: 0; top: 100%; margin-top: 4px; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; box-shadow: var(--shadow); max-height: 280px; overflow: auto; }
.sugg-list button { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 10px; width: 100%; text-align: left; border: 0; border-bottom: 1px solid var(--line); background: none; padding: 8px 10px; cursor: pointer; align-items: center; font-size: .88rem; }
.sugg-list button:hover, .sugg-list button.hl { background: var(--accent-soft); }
.picked { display: flex; gap: 10px; align-items: center; background: var(--accent-soft); border-radius: 8px; padding: 8px 10px; font-size: .9rem; flex-wrap: wrap; }


/* ---------- status track (ribbon + medallions) ---------- */
.track { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); padding: 6px 0 4px; }
.tk { position: relative; display: grid; align-content: start; justify-items: center; text-align: center; gap: 0; min-width: 0; --c: var(--s-off); }
.tk.s1 { --c: var(--s1); } .tk.s2 { --c: var(--s2); } .tk.s3 { --c: var(--s3); } .tk.s4 { --c: var(--s4); } .tk.s5 { --c: var(--s5); }
.tk.off { --c: var(--s-off); }
.tk .seg { position: absolute; left: 0; right: 0; top: 30px; height: 30px; background: var(--c); background: linear-gradient(180deg, color-mix(in srgb, var(--c) 88%, #fff) 0%, var(--c) 55%, color-mix(in srgb, var(--c) 82%, #000) 100%); }

  function shrink(file) {
    return new Promise(function (res) {
      var fr = new FileReader();
      fr.onload = function () {
        var img = new Image();
        img.onload = function () {
          var max = 1280, w = img.width, hh = img.height, k = Math.min(1, max / Math.max(w, hh));
          var c = document.createElement('canvas'); c.width = Math.round(w * k); c.height = Math.round(hh * k);
          c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
          res(c.toDataURL('image/jpeg', .78));
        };
        img.onerror = function () { toast('เปิดไฟล์รูป ' + file.name + ' ไม่ได้', true); res(null); };
        img.src = fr.result;
      };
      fr.readAsDataURL(file);
    });
  }

        '<div class="kpis" style="grid-template-columns:repeat(3,minmax(0,1fr))"><div class="kpi"><span class="l">ซ่อมทั้งหมด</span><span class="v">' + r.tickets.length + '</span></div><div class="kpi"><span class="l">ค่าซ่อมรวม (ที่บันทึก)</span><span class="v" style="font-size:1.2rem">' + money(r.totalCost) + '</span></div><div class="kpi"><span class="l">ซ่อมครั้งแรก</span><span class="v" style="font-size:1.2rem">' + thDate(e.firstRepair, false) + '</span></div></div>' +
        (e.aliases ? '<div class="small muted">ชื่อเรียกในใบแจ้งซ่อม: ' + esc(e.aliases) + '</div>' : '') + (e.legacyCode ? '<div class="small">รหัสเดิมที่สาขาใช้: <span class="code">' + esc(e.legacyCode) + '</span></div>' : '') +
        (e.note ? '<div class="small">หมายเหตุ: ' + esc(e.note) + '</div>' : '') + '<div id="qMx"></div>' +
        '<h3>ประวัติการซ่อม</h3><div class="tscroll"><table class="t"><thead><tr><th>วันที่</th><th>เลขที่</th><th>อาการ</th><th>ผล/บันทึกช่าง</th><th>สถานะ</th></tr></thead><tbody>' +
        r.tickets.map(function (t) { return '<tr class="click" data-t="' + esc(t.ticketNo) + '"><td class="small" style="white-space:nowrap">' + thDate(t.createdAt, false) + '</td><td class="mono small">' + esc(t.ticketNo) + '</td><td>' + esc(t.symptom) + (t.cause && !/ไม่ทราบ/.test(t.cause) ? '<div class="muted small">สาเหตุ: ' + esc(t.cause) + '</div>' : '') + '</td><td class="small">' + esc(String(t.repairDetail || '').slice(0, 140)) + '</td><td>' + pill(t.status) + '</td></tr>'; }).join('') +
        '</tbody></table></div>', true);
      qsa('[data-t]', m).forEach(function (x) { x.onclick = function () { m.remove(); go('ticket', x.dataset.t); }; });
      if (canEdit) {
        qs('#qEdit', m).onclick = function () { m.remove(); editEquip(e, function () { showEquip(e.code, after); if (after) after(); }); };
        qs('#qMerge', m).onclick = function () {
          var mx = qs('#qMx', m);
          mx.innerHTML = '<div class="picked" style="background:var(--amber-soft)"><span>ย้ายประวัติทั้งหมดของรหัสนี้ไปรวมกับรหัส</span><input class="i" id="qTo" placeholder="' + esc(e.branch) + '-XXX-0000" style="width:180px"><button class="btn sm pri" type="button" id="qGo">รวม</button></div>';
          qs('#qGo', m).onclick = function (ev) {
            var to = qs('#qTo', m).value.trim().toUpperCase();
            busy(ev.currentTarget, authed('mergeEquipment', e.code, to)).then(function (x) { m.remove(); toast('ย้าย ' + x.moved + ' รายการไปที่ ' + to + ' แล้ว'); showEquip(to, after); if (after) after(); });
          };
        };
      }
    }).catch(function (er) { toast(er.message, true); });
  }
  function editEquip(e, done) {
    var b = state.boot, isNew = !e; e = e || {};
    var m = modal('<h2>' + (isNew ? 'เพิ่มอุปกรณ์' : 'แก้ไข ' + esc(e.code)) + '</h2><form class="stack" id="qf"><div class="grid2">' +
      '<label class="f"><span>สาขา</span><select class="i" id="qBr"' + (isNew ? '' : ' disabled') + '>' + opts(b.branches, e.branch || '', 'เลือกสาขา') + '</select></label>' +
      '<label class="f"><span>ประเภท</span><select class="i" id="qCat">' + opts(b.categories.map(function (c) { return c.name; }), e.category || '', 'เลือกประเภท') + '</select></label>' +
      '<label class="f span2"><span>ชื่ออุปกรณ์</span><input class="i" id="qName" value="' + esc(e.name || '') + '"></label>' +
      '<label class="f"><span>แผนก</span><select class="i" id="qDept">' + opts(b.departments, e.department || '', '-') + '</select></label>' +
      '<label class="f"><span>สถานะ</span><select class="i" id="qSt">' + opts(['ใช้งาน', 'ซ่อมไม่ได้/รอจัดซื้อใหม่', 'จำหน่ายแล้ว', 'ไม่ใช้งาน'], e.status || 'ใช้งาน') + '</select></label>' +
      '<label class="f"><span>รหัสเดิม/เลขครุภัณฑ์</span><input class="i" id="qLeg" value="' + esc(e.legacyCode || '') + '"></label>' +
      '<label class="f"><span>หมายเหตุ</span><input class="i" id="qNote" value="' + esc(e.note || '') + '"></label></div>' +
      (isNew ? '<div class="muted small">รหัสจะออกให้อัตโนมัติตามสาขาและประเภท</div>' : '<div class="muted small">เปลี่ยนประเภทแล้วรหัสเดิมจะคงไว้</div>') +
      '<div class="row"><button class="btn pri" type="submit">บันทึก</button><button class="btn ghost" type="button" data-close>ยกเลิก</button></div></form>');
    qs('#qf', m).onsubmit = function (ev) {
      ev.preventDefault();
      busy(ev.submitter || ev.target.querySelector("[type=submit]"), authed('saveEquipment', { code: e.code || '', branch: qs('#qBr', m).value, category: qs('#qCat', m).value, name: qs('#qName', m).value, department: qs('#qDept', m).value, status: qs('#qSt', m).value, legacyCode: qs('#qLeg', m).value, note: qs('#qNote', m).value }))
        .then(function (r) { m.remove(); toast('บันทึก ' + r.code + ' แล้ว'); done && done(r); });
    };
  }

  // ---------- users ----------
  function viewUsers(el) {
    authed('listUsers').then(function (rows) {
      var b = state.boot;
      el.innerHTML = '<div class="head"><h1>ผู้ใช้งาน</h1><button class="btn pri" type="button" id="uAdd">' + ICON.add + 'เพิ่มผู้ใช้</button></div>' +
        '<section class="panel"><div class="tscroll"><table class="t"><thead><tr><th>ชื่อผู้ใช้</th><th>ชื่อ</th><th>บทบาท</th><th>สาขา</th><th>สถานะ</th><th></th></tr></thead><tbody>' +
        rows.map(function (u, i) { return '<tr><td class="mono">' + esc(u.username) + '</td><td>' + esc(u.name) + '</td><td>' + esc(b.roles[u.role] || u.role) + '</td><td>' + esc(u.branch || '-') + '</td><td>' + (u.active ? '<span class="pill st-done">ใช้งาน</span>' : '<span class="pill">ปิด</span>') + '</td><td><button class="btn sm" type="button" data-u="' + i + '">แก้ไข</button></td></tr>'; }).join('') +
        '</tbody></table></div></section><div class="muted small">สาขาเห็นและแจ้งซ่อมได้เฉพาะสาขาตัวเอง · ช่างรับเรื่อง บันทึก และปิดงาน · ส่วนกลางทำได้เหมือนช่างและแก้ทะเบียนอุปกรณ์ · ผู้ดูแลระบบจัดการผู้ใช้</div>';
      qs('#uAdd').onclick = function () { editUser(null); };
      qsa('[data-u]', el).forEach(function (x) { x.onclick = function () { editUser(rows[+x.dataset.u]); }; });
    }).catch(function (e) { el.innerHTML = '<div class="panel err">' + esc(e.message) + '</div>'; });
  }
  function editUser(u) {
    var b = state.boot, isNew = !u; u = u || { active: true, role: 'branch' };
    var m = modal('<h2>' + (isNew ? 'เพิ่มผู้ใช้' : 'แก้ไข ' + esc(u.username)) + '</h2><form class="stack" id="uf"><div class="grid2">' +
      '<label class="f"><span>ชื่อผู้ใช้</span><input class="i" id="uU" value="' + esc(u.username || '') + '"' + (isNew ? '' : ' disabled') + ' autocomplete="off"></label>' +
      '<label class="f"><span>ชื่อที่แสดง</span><input class="i" id="uN" value="' + esc(u.name || '') + '"></label>' +
      '<label class="f"><span>บทบาท</span><select class="i" id="uR">' + opts(Object.keys(b.roles).map(function (k) { return { code: k, name: b.roles[k] }; }), u.role) + '</select></label>' +
      '<label class="f"><span>สาขา (สำหรับบทบาทสาขา)</span><select class="i" id="uB">' + opts(b.branches, u.branch || '', '-') + '</select></label>' +
      '<label class="f"><span>' + (isNew ? 'รหัสผ่าน' : 'ตั้งรหัสผ่านใหม่ (เว้นว่างถ้าไม่เปลี่ยน)') + '</span><input class="i" id="uP" type="password" autocomplete="new-password"></label>' +
      '<label class="f"><span>สถานะ</span><select class="i" id="uA"><option value="1"' + (u.active ? ' selected' : '') + '>ใช้งาน</option><option value="0"' + (u.active ? '' : ' selected') + '>ปิดการใช้งาน</option></select></label></div>' +
      '<div class="row"><button class="btn pri" type="submit">บันทึก</button><button class="btn ghost" type="button" data-close>ยกเลิก</button></div></form>');
    qs('#uf', m).onsubmit = function (ev) {
      ev.preventDefault();
      busy(ev.submitter || ev.target.querySelector("[type=submit]"), authed('saveUser', { username: qs('#uU', m).value, name: qs('#uN', m).value, role: qs('#uR', m).value, branch: qs('#uB', m).value, password: qs('#uP', m).value, active: qs('#uA', m).value === '1' }))
        .then(function () { m.remove(); toast('บันทึกผู้ใช้แล้ว'); go('users'); });
    };
  }

  // ---------- settings (admin) ----------
  function viewSettings(el) {
    authed('getSettings').then(function (c) { drawSettings(el, c); }).catch(function (e) { el.innerHTML = '<div class="panel err">' + esc(e.message) + '</div>'; });
  }
  function drawSettings(el, c) {
    var b = state.boot, ev = String(c.lineEvents || '').split(',');
    var groups = [['lineCentral', 'ส่วนกลาง', 'ส่วนกลาง']].concat(b.branches.map(function (x) { return ['lineBranch_' + x.code, x.name, x.code]; }));
    function copyRow(cmd) { return '<div class="cmd"><code class="mono">' + esc(cmd) + '</code><button class="btn sm" type="button" data-copy="' + esc(cmd) + '">คัดลอก</button></div>'; }
    el.innerHTML = '<div class="head"><div><h1>ตั้งค่า</h1><div class="muted small">ข้อมูลหน่วยงานและการแจ้งเตือนทางอีเมล / LINE</div></div></div>' +
      '<div class="detail"><div class="stack">' +
      '<section class="panel stack"><h2>ข้อมูลทั่วไป</h2><div class="grid2">' +
      '<label class="f"><span>ชื่อหน่วยงาน (หัวใบแจ้งซ่อม)</span><input class="i" id="sOrg" value="' + esc(c.orgName) + '"></label>' +
      '<label class="f"><span>อีเมลแจ้งเมื่อมีใบแจ้งซ่อมใหม่ (คั่นด้วย ,)</span><input class="i" id="sMail" value="' + esc(c.notifyEmail) + '" inputmode="email"></label>' +
      '<label class="f span2"><span>ลิงก์แอปบนมือถือ (ปุ่มในข้อความ LINE จะเปิดลิงก์นี้ เว้นว่าง = เปิดเว็บแอป Apps Script)</span><input class="i" id="sApp" value="' + esc(c.appUrl || '') + '" placeholder="https://ชื่อบัญชี.github.io/repair/" inputmode="url"></label></div></section>' +
      '<section class="panel stack"><div class="ptitle"><h2>LINE แจ้งเตือน</h2>' + (c.lineTokenSet ? '<span class="pill st-done">เชื่อมต่อแล้ว</span>' : '<span class="pill">ยังไม่ได้ตั้งค่า</span>') + '</div>' +
      '<label class="f"><span>Channel access token (long-lived) จาก LINE Developers</span><input class="i mono" id="sTok" type="password" autocomplete="off" placeholder="' + (c.lineTokenSet ? 'ตั้งค่าแล้ว ' + esc(c.lineToken) + ' — กรอกใหม่เพื่อเปลี่ยน' : 'วาง token ที่นี่') + '"></label>' +
      '<label class="f"><span>Webhook URL (นำไปใส่ใน LINE Developers > Messaging API)</span>' + (c.webhookUrl ? copyRow(c.webhookUrl) : '<div class="muted small">จะแสดงเมื่อเผยแพร่เป็นเว็บแอปแล้ว (URL เดียวกับหน้าเว็บนี้ ลงท้าย /exec)</div>') + '</label>' +
      '<div class="f"><span>แจ้งเตือนเมื่อ</span><div class="radios">' + c.events.map(function (x) {
        return '<label><input type="checkbox" name="sEv" value="' + x.code + '"' + (ev.indexOf(x.code) >= 0 ? ' checked' : '') + '><span>' + esc(x.name) + ' <span class="muted small">→ ' + esc(x.to) + '</span></span></label>';
      }).join('') + '</div></div>' +
      '<div class="muted small">LINE นับโควตาข้อความตามจำนวนสมาชิกในกลุ่ม (ส่ง 1 ครั้งเข้ากลุ่ม 6 คน = 6 ข้อความ) เลือกเฉพาะเหตุการณ์ที่จำเป็นถ้าใช้แพ็กเกจฟรี ส่วนการพิมพ์ถามในกลุ่ม ("งานค้าง", เลขที่ใบแจ้งซ่อม) ไม่นับโควตา</div>' +
      '<div class="err" id="sErr"></div><div class="row"><button class="btn pri" type="button" id="sSave">บันทึกการตั้งค่า</button><button class="btn" type="button" id="sTest">ส่งข้อความทดสอบ</button></div><div id="sRes"></div></section>' +
      '</div><div class="stack">' +
      '<section class="panel stack"><h2>ลงทะเบียนกลุ่ม LINE</h2><div class="small">เพิ่มบัญชี LINE OA ของระบบเข้ากลุ่มส่วนกลางและกลุ่มของแต่ละสาขา แล้วพิมพ์คำสั่งในกลุ่มนั้น รหัสลงทะเบียน <b class="mono">' + esc(c.lineRegisterCode) + '</b></div>' +
      '<div class="tscroll"><table class="t"><thead><tr><th>ห้อง</th><th>คำสั่งที่พิมพ์ในกลุ่ม</th><th class="num">กลุ่มที่ผูก</th><th></th></tr></thead><tbody>' +
      groups.map(function (g) {
        var n = c[g[0] + '_n'] || 0;
        return '<tr><td style="white-space:nowrap">' + esc(g[1]) + '</td><td>' + copyRow('ลงทะเบียน ' + g[2] + ' ' + c.lineRegisterCode) + '</td><td class="num">' + (n ? '<span class="pill st-done">' + n + '</span>' : '<span class="muted">-</span>') + '</td><td>' + (n ? '<button class="btn sm dng" type="button" data-clear="' + g[0] + '">ล้าง</button>' : '') + '</td></tr>';
      }).join('') + '</tbody></table></div>' +
      '<div class="muted small">ในกลุ่มที่ลงทะเบียนแล้วพิมพ์ <b>งานค้าง</b> เพื่อดูสรุป หรือพิมพ์เลขที่ใบแจ้งซ่อมเพื่อดูสถานะ พิมพ์ <b>ยกเลิกลงทะเบียน</b> เพื่อหยุดแจ้งเตือน</div></section>' +
      '</div></div>';
    qsa('[data-copy]', el).forEach(function (bt) {
      bt.onclick = function () {
        var v = bt.dataset.copy;
        Promise.resolve().then(function () { return navigator.clipboard.writeText(v); }).then(function () { toast('คัดลอกแล้ว'); }, function () {
          var code = bt.previousElementSibling, r = document.createRange(); r.selectNodeContents(code); var sel = getSelection(); sel.removeAllRanges(); sel.addRange(r); toast('เลือกข้อความแล้ว กด Ctrl+C เพื่อคัดลอก');
        });
      };
    });
    function collect() {
      return { orgName: qs('#sOrg').value, notifyEmail: qs('#sMail').value, appUrl: qs('#sApp').value.trim(), lineToken: qs('#sTok').value.trim(),
        lineEvents: qsa('[name=sEv]:checked', el).map(function (x) { return x.value; }).join(',') || 'none' };
    }
    qs('#sSave').onclick = function (e) {
      busy(e.currentTarget, authed('saveSettings', collect())).then(function (c2) { state.boot.orgName = c2.orgName || state.boot.orgName; toast('บันทึกแล้ว'); drawSettings(el, c2); });
    };
    qs('#sTest').onclick = function (e) {
      var btn = e.currentTarget;
      busy(btn, authed('saveSettings', collect()).then(function () { return authed('testNotify'); })).then(function (r) {
        var box = qs('#sRes');
        if (!r || r.demo) { box.innerHTML = '<div class="demo-banner">โหมดตัวอย่างส่ง LINE จริงไม่ได้ ในระบบจริงข้อความทดสอบจะเข้าทุกกลุ่มที่ลงทะเบียน</div>'; return; }
        box.innerHTML = '<div class="' + (r.failed || r.errors.length ? 'confirm' : 'picked') + '">ส่งสำเร็จ ' + r.sent + ' จาก ' + r.targets + ' ห้อง' +
          (r.errors.length ? '<br>' + r.errors.map(esc).join('<br>') : '') + '</div>';
      });
    };
    qsa('[data-clear]', el).forEach(function (bt) {
      bt.onclick = function () {
        var d = {}; d[bt.dataset.clear] = '';
        busy(bt, authed('saveSettings', d)).then(function (c2) { toast('ล้างการผูกกลุ่มแล้ว'); drawSettings(el, c2); });
      };
    });
  }

  // ---------- อัปเดตอัตโนมัติ: กลับมาที่แท็บ / ทุก 60 วินาที (เห็นใบแจ้งซ่อมใหม่จากเครื่องอื่น) ----------
  function autoRefresh() {
    if (!state.token || !state.pane || state.pane.hidden || !KEEP[state.view] || !state.pane._refresh) return;
    if (document.querySelector('.modal')) return;
    var a = document.activeElement;
    if (a && /^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName) && state.pane.contains(a)) return;
    state.pane._refresh();
  }
  document.addEventListener('visibilitychange', function () { if (document.visibilityState === 'visible') autoRefresh(); });
  setInterval(function () { if (document.visibilityState === 'visible') autoRefresh(); }, 60000);

  // ---------- boot ----------
  window.addEventListener('unhandledrejection', function (e) { e.preventDefault(); });
  function boot() {
    var saved = store('mt_token');
    if (saved && LIVE) { state.token = saved; start(); } else renderLogin();
  }
  // ลิงก์จาก LINE: ...exec?t=MA10268554 เปิดใบแจ้งซ่อมหลังเข้าสู่ระบบ
  var booted = false;
  function bootOnce() { if (!booted) { booted = true; boot(); } }
  if (IS_GAS && google.script.url) {
    try { google.script.url.getLocation(function (loc) { state.deep = (loc && loc.parameter && loc.parameter.t) || null; bootOnce(); }); } catch (e) { bootOnce(); }
    setTimeout(bootOnce, 1500);
  } else {
    try { var mt = /[?&]t=([A-Za-z0-9]+)/.exec(location.search); if (mt) state.deep = mt[1]; } catch (e) { }
    bootOnce();
  }
})();

</script>
<script>
if ('serviceWorker' in navigator) window.addEventListener('load', function () { navigator.serviceWorker.register('sw.js').catch(function () {}); });
</script>
